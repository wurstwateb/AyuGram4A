name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free up disk space.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/graalvm /usr/local/.ghcup \
                      /usr/local/share/powershell /usr/local/share/chromium \
                      /usr/local/lib/node_modules /opt/ghc || true
          sudo apt-get remove -y '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' azure-cli firefox mono-devel || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          df -h

      - name: Install build tools.
        run: |
          sudo apt-get update
          sudo apt-get install -y bison gcc make curl ninja-build ccache

      - name: Setup Java.
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK.
        uses: android-actions/setup-android@v3

      - name: Install NDK r21e (required by this project).
        run: sdkmanager --install "ndk;21.4.7075529" "cmake;3.22.1"

      - name: Verify signing keystore.
        run: |
          # The keystore is committed so every build is signed with the SAME key,
          # which lets new APKs install over previous ones as updates.
          keytool -list -keystore TMessagesProj/config/extera.jks -storepass ayugramce
          ls -la TMessagesProj/config/

      - name: Write API_KEYS.
        run: |
          printf 'APP_ID = 6\nAPP_HASH = "eb06d4abfb49dc3eeb1aeb98ae0f581e"\nMAPS_V2_API = "dummy"\nSIGNING_KEY_PASSWORD = ayugramce\nSIGNING_KEY_ALIAS = ayugramce\nSIGNING_KEY_STORE_PASSWORD = ayugramce\n' > API_KEYS
          echo "--- API_KEYS ---"; cat API_KEYS

      - name: Build release APK.
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatRelease --no-daemon --stacktrace

      - name: List outputs.
        if: always()
        run: find TMessagesProj/build/outputs -name "*.apk" -exec ls -la {} \; || true

      - name: Upload APK.
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram4A-APK
          path: TMessagesProj/build/outputs/apk/afat/release/*.apk
          if-no-files-found: error

      - name: Upload keystore (to freeze signing key later).
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: TMessagesProj/config/extera.jks
